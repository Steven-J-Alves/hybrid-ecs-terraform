# apps stack CI — 5 ECS workloads (api, front, worker, scheduler, manager)
# Both launch types: EC2 (AWS) + EXTERNAL (VPS ECS Anywhere).
# Requires TF_VAR_rds_db_password (currently 'unused' — Postgres commented out).

.apps_base:
  extends: .tf_base
  cache:
    key: "hybrid-apps-${APPS_ENV_NAME}"
    paths: [ "apps/environments/${APPS_ENV_NAME}/.terraform/" ]
    policy: pull-push

# ─── prod (main branch) ───────────────────────────────────────────────────────

apps:prod:validate:
  extends: .apps_base
  stage: validate
  variables:
    APPS_ENV_NAME: prod
    APPS_TF_WORKDIR: apps/environments/prod
  resource_group: hybrid-apps-prod
  script:
    - terraform -chdir=$APPS_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$APPS_TF_WORKDIR validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [ "apps/**/*", "modules/**/*" ]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ "apps/**/*", "modules/**/*" ]

apps:prod:plan:
  extends: .apps_base
  stage: plan
  variables:
    APPS_ENV_NAME: prod
    APPS_TF_WORKDIR: apps/environments/prod
  resource_group: hybrid-apps-prod
  script:
    - terraform -chdir=$APPS_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$APPS_TF_WORKDIR plan -input=false -out=tfplan
  artifacts:
    paths: [ "apps/environments/prod/tfplan" ]
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [ "apps/**/*", "modules/**/*" ]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ "apps/**/*", "modules/**/*" ]
  needs: [ apps:prod:validate ]

apps:prod:apply:
  extends: .apps_base
  stage: apply
  variables:
    APPS_ENV_NAME: prod
    APPS_TF_WORKDIR: apps/environments/prod
  resource_group: hybrid-apps-prod
  environment:
    name: hybrid-prod
    action: start
  script:
    - terraform -chdir=$APPS_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$APPS_TF_WORKDIR apply -input=false tfplan
    - echo "→ Next step: push arm64 nginx placeholder to 5 ECRs so tasks reach steady state"
    - echo "→ Run manually or wait for CI in test-apps repos: bash scripts/push-placeholders.sh p-app"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
  needs: [ apps:prod:plan ]

apps:prod:destroy:
  extends: .apps_base
  stage: destroy
  variables:
    APPS_ENV_NAME: prod
    APPS_TF_WORKDIR: apps/environments/prod
  resource_group: hybrid-apps-prod
  environment:
    name: hybrid-prod
    action: stop
  script:
    - terraform -chdir=$APPS_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$APPS_TF_WORKDIR destroy -input=false -auto-approve
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# ─── homolog (homolog branch) ─────────────────────────────────────────────────

apps:homolog:validate:
  extends: .apps_base
  stage: validate
  variables:
    APPS_ENV_NAME: homolog
    APPS_TF_WORKDIR: apps/environments/homolog
  resource_group: hybrid-apps-homolog
  script:
    - terraform -chdir=$APPS_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$APPS_TF_WORKDIR validate
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog"'
      changes: [ "apps/**/*", "modules/**/*" ]

apps:homolog:plan:
  extends: .apps_base
  stage: plan
  variables:
    APPS_ENV_NAME: homolog
    APPS_TF_WORKDIR: apps/environments/homolog
  resource_group: hybrid-apps-homolog
  script:
    - terraform -chdir=$APPS_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$APPS_TF_WORKDIR plan -input=false -out=tfplan
  artifacts:
    paths: [ "apps/environments/homolog/tfplan" ]
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog"'
      changes: [ "apps/**/*", "modules/**/*" ]
  needs: [ apps:homolog:validate ]

apps:homolog:apply:
  extends: .apps_base
  stage: apply
  variables:
    APPS_ENV_NAME: homolog
    APPS_TF_WORKDIR: apps/environments/homolog
  resource_group: hybrid-apps-homolog
  environment:
    name: hybrid-homolog
    action: start
  script:
    - terraform -chdir=$APPS_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$APPS_TF_WORKDIR apply -input=false tfplan
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog"'
      when: manual
      allow_failure: false
  needs: [ apps:homolog:plan ]

apps:homolog:destroy:
  extends: .apps_base
  stage: destroy
  variables:
    APPS_ENV_NAME: homolog
    APPS_TF_WORKDIR: apps/environments/homolog
  resource_group: hybrid-apps-homolog
  environment:
    name: hybrid-homolog
    action: stop
  script:
    - terraform -chdir=$APPS_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$APPS_TF_WORKDIR destroy -input=false -auto-approve
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog"'
      when: manual
      allow_failure: true
