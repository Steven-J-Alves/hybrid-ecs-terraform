# cluster stack CI — ECS cluster + ALBs + ASG capacity provider.
# Applies to hybrid-ecs-terraform. Repo mounted at $CI_PROJECT_DIR.
# TF workdir uses relative sources (../../modules) — must mount entire repo.

.cluster_base:
  extends: .tf_base
  cache:
    key: "hybrid-cluster-${CI_JOB_STAGE}"
    paths: [ "cluster/environments/${CLUSTER_ENV_NAME}/.terraform/" ]
    policy: pull-push

# ─── prod (main branch) ───────────────────────────────────────────────────────

cluster:prod:validate:
  extends: .cluster_base
  stage: validate
  variables:
    CLUSTER_ENV_NAME: prod
    CLUSTER_TF_WORKDIR: cluster/environments/prod
  resource_group: hybrid-cluster-prod
  script:
    - terraform -chdir=$CLUSTER_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$CLUSTER_TF_WORKDIR validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [ "cluster/**/*", "modules/**/*" ]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ "cluster/**/*", "modules/**/*" ]

cluster:prod:plan:
  extends: .cluster_base
  stage: plan
  variables:
    CLUSTER_ENV_NAME: prod
    CLUSTER_TF_WORKDIR: cluster/environments/prod
  resource_group: hybrid-cluster-prod
  script:
    - terraform -chdir=$CLUSTER_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$CLUSTER_TF_WORKDIR plan -input=false -out=tfplan
  artifacts:
    paths: [ "cluster/environments/prod/tfplan" ]
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [ "cluster/**/*", "modules/**/*" ]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ "cluster/**/*", "modules/**/*" ]
  needs: [ cluster:prod:validate ]

cluster:prod:apply:
  extends: .cluster_base
  stage: apply
  variables:
    CLUSTER_ENV_NAME: prod
    CLUSTER_TF_WORKDIR: cluster/environments/prod
  resource_group: hybrid-cluster-prod
  environment:
    name: hybrid-prod
    action: start
  script:
    - terraform -chdir=$CLUSTER_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$CLUSTER_TF_WORKDIR apply -input=false tfplan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
  needs: [ cluster:prod:plan ]

cluster:prod:destroy:
  extends: .cluster_base
  stage: destroy
  variables:
    CLUSTER_ENV_NAME: prod
    CLUSTER_TF_WORKDIR: cluster/environments/prod
  resource_group: hybrid-cluster-prod
  environment:
    name: hybrid-prod
    action: stop
  script:
    - terraform -chdir=$CLUSTER_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$CLUSTER_TF_WORKDIR destroy -input=false -auto-approve
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# ─── homolog (homolog branch) ─────────────────────────────────────────────────

cluster:homolog:validate:
  extends: .cluster_base
  stage: validate
  variables:
    CLUSTER_ENV_NAME: homolog
    CLUSTER_TF_WORKDIR: cluster/environments/homolog
  resource_group: hybrid-cluster-homolog
  script:
    - terraform -chdir=$CLUSTER_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$CLUSTER_TF_WORKDIR validate
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog"'
      changes: [ "cluster/**/*", "modules/**/*" ]

cluster:homolog:plan:
  extends: .cluster_base
  stage: plan
  variables:
    CLUSTER_ENV_NAME: homolog
    CLUSTER_TF_WORKDIR: cluster/environments/homolog
  resource_group: hybrid-cluster-homolog
  script:
    - terraform -chdir=$CLUSTER_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$CLUSTER_TF_WORKDIR plan -input=false -out=tfplan
  artifacts:
    paths: [ "cluster/environments/homolog/tfplan" ]
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog"'
      changes: [ "cluster/**/*", "modules/**/*" ]
  needs: [ cluster:homolog:validate ]

cluster:homolog:apply:
  extends: .cluster_base
  stage: apply
  variables:
    CLUSTER_ENV_NAME: homolog
    CLUSTER_TF_WORKDIR: cluster/environments/homolog
  resource_group: hybrid-cluster-homolog
  environment:
    name: hybrid-homolog
    action: start
  script:
    - terraform -chdir=$CLUSTER_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$CLUSTER_TF_WORKDIR apply -input=false tfplan
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog"'
      when: manual
      allow_failure: false
  needs: [ cluster:homolog:plan ]

cluster:homolog:destroy:
  extends: .cluster_base
  stage: destroy
  variables:
    CLUSTER_ENV_NAME: homolog
    CLUSTER_TF_WORKDIR: cluster/environments/homolog
  resource_group: hybrid-cluster-homolog
  environment:
    name: hybrid-homolog
    action: stop
  script:
    - terraform -chdir=$CLUSTER_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$CLUSTER_TF_WORKDIR destroy -input=false -auto-approve
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog"'
      when: manual
      allow_failure: true
