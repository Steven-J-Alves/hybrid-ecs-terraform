# Apply order: network → cluster → apps
# Branches: main → prod | homolog → homolog
# apps2: prod (prod-app2) + homolog (homolog-app2).

stages:
  - validate
  - plan
  - apply
  - destroy

# ── Job templates (hidden) ────────────────────────────────────────────────────

.apps_validate:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  tags: [docker]
  stage: validate
  script:
    - terraform -chdir=$APPS_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$APPS_TF_WORKDIR validate

.apps_plan:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  tags: [docker]
  stage: plan
  script:
    - terraform -chdir=$APPS_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$APPS_TF_WORKDIR plan -input=false -out=tfplan

.apps_apply:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  tags: [docker]
  stage: apply
  script:
    - terraform -chdir=$APPS_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$APPS_TF_WORKDIR apply -input=false -auto-approve
  when: manual
  allow_failure: false

.apps_destroy:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  tags: [docker]
  stage: destroy
  script:
    - terraform -chdir=$APPS_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$APPS_TF_WORKDIR destroy -input=false -auto-approve
  when: manual
  needs: []

# ── PROD — main branch ────────────────────────────────────────────────────────

apps:validate:
  extends: .apps_validate
  variables:
    APPS_TF_WORKDIR: "apps/environments/prod"
    CLUSTER_STATE_ENV: "prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
        - modules/**/*

apps:plan:
  extends: .apps_plan
  variables:
    APPS_TF_WORKDIR: "apps/environments/prod"
  artifacts:
    paths:
      - apps/environments/prod/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
        - modules/**/*
  needs:
    - apps:validate

apps:apply:
  extends: .apps_apply
  variables:
    APPS_TF_WORKDIR: "apps/environments/prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
        - modules/**/*
  needs:
    - apps:plan

apps:destroy:
  extends: .apps_destroy
  variables:
    APPS_TF_WORKDIR: "apps/environments/prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
        - modules/**/*

# ── HOMOLOG — homolog branch ──────────────────────────────────────────────────

