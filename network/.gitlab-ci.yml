# network stack CI — VPC + subnets + SGs + ACM cert. Prod-only (shared VPC).

variables:
  NETWORK_TF_WORKDIR: "network/environments/prod"

.network_base:
  extends: .tf_base
  resource_group: hybrid-network-prod   # serialize apply/destroy
  cache:
    key: hybrid-network-prod
    paths: [ "$NETWORK_TF_WORKDIR/.terraform/" ]
    policy: pull-push

network:validate:
  extends: .network_base
  stage: validate
  script:
    - terraform -chdir=$NETWORK_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$NETWORK_TF_WORKDIR validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [ "network/**/*" ]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ "network/**/*" ]

network:plan:
  extends: .network_base
  stage: plan
  script:
    - terraform -chdir=$NETWORK_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$NETWORK_TF_WORKDIR plan -input=false -out=tfplan
  artifacts:
    paths: [ "$NETWORK_TF_WORKDIR/tfplan" ]
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [ "network/**/*" ]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ "network/**/*" ]
  needs: [ network:validate ]

network:apply:
  extends: .network_base
  stage: apply
  environment:
    name: hybrid-prod
    action: start
  script:
    - terraform -chdir=$NETWORK_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$NETWORK_TF_WORKDIR apply -input=false tfplan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
  needs: [ network:plan ]

network:destroy:
  extends: .network_base
  stage: destroy
  environment:
    name: hybrid-prod
    action: stop
  script:
    - terraform -chdir=$NETWORK_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$NETWORK_TF_WORKDIR destroy -input=false -auto-approve
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
